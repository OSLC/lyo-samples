name: "CI (client)"

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - 'lyo-client-samples/**'
      - '**/pom.xml'
  schedule:
    - cron: "01 13 1-7 * 5" # catch SNAPSHOT breaking changes
  merge_group:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && !contains(github.event.pull_request.labels.*.name, 'ci:full') }}

jobs:
  build-client-samples:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
#        java-version: ['17', '21']
#        distribution: ['zulu', 'oracle', 'corretto', 'liberica']
        include:
          - java-version: '21'
            distribution: 'temurin'
          - java-version: '25'
            distribution: 'temurin'
          - java-version: '27'
            distribution: 'liberica'
          # - java-version: '26'
          #   distribution: 'oracle'
          # - java-version: '25-ea'
          #   distribution: 'zulu'
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK ${{ matrix.java-version }}
        uses: actions/setup-java@v6
        with:
          distribution:  ${{ matrix.distribution }}
          java-version: ${{ matrix.java-version }}
          cache: 'maven'
      - name: Build Lyo Client samples
        run: |
          mvn -B clean verify -Dspotless.skip=true -Drewrite.skip=true --file lyo-client-samples/pom.xml

  format-client-samples:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - name: Set up JDK 25
        uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '25'
          cache: 'maven'
      - name: Check Spotless formatting
        run: |
          mvn -B spotless:check --file lyo-client-samples/pom.xml
      - name: Check OpenRewrite and Spotless stability
        run: |
          mvn -B org.openrewrite.maven:rewrite-maven-plugin:run spotless:apply -DskipTests --file lyo-client-samples/pom.xml
          if [ -z "$(git status --porcelain)" ]; then
            echo "OpenRewrite and Spotless PASS"
          else
            git status --porcelain
            echo "OpenRewrite or Spotless FAIL; run 'mvn -B org.openrewrite.maven:rewrite-maven-plugin:run spotless:apply -DskipTests --file lyo-client-samples/pom.xml' locally" >&2
            exit 1
          fi
